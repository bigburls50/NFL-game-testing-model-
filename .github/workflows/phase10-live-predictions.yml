name: Refresh Phase 10 provisional predictions
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase10-live-predictions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test phase10/*.test.mjs
      - name: Settle existing forward paper trial from final scores
        run: |
          node phase10/run-forward-paper-test.mjs
          node phase10/run-efficiency-shadow-settlement.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase10/forward-paper-results.json phase10/efficiency-shadow-week11-2026-results.json
          git diff --cached --quiet || git commit -m 'Update fixed-slate paper test settlements'
          git push origin HEAD:main
      - run: node phase10/generate-provisional-feed.mjs --archive
      - run: node phase10/score-pregame-observations.mjs
        continue-on-error: true
      - run: node phase10/run-value-paper-trial.mjs --capture
        continue-on-error: true
      - name: Publish timestamped snapshot for Cloudflare assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase10/live-predictions.json
          if [ -d phase10/pregame-observations ]; then git add phase10/pregame-observations; fi
          if [ -f phase10/pregame-observation-results.json ]; then git add phase10/pregame-observation-results.json; fi
          if [ -d phase10/value-paper-trials ]; then git add phase10/value-paper-trials; fi
          if [ -f phase10/value-paper-trial-results.json ]; then git add phase10/value-paper-trial-results.json; fi
          git diff --cached --quiet || git commit -m 'Refresh Phase 10 provisional prediction snapshot'
          git push origin HEAD:main
