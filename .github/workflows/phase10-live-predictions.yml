name: Refresh Phase 10 provisional predictions
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase10-live-predictions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test phase10/*.test.mjs
      - run: node phase10/generate-provisional-feed.mjs
      - name: Publish timestamped snapshot for Cloudflare assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase10/live-predictions.json
          git diff --cached --quiet || git commit -m 'Refresh Phase 10 provisional prediction snapshot'
          git push origin HEAD:main
