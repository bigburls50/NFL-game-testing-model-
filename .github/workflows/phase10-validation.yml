name: Phase 10 validation
on:
  push:
    paths:
      - 'phase10/**'
      - '.github/workflows/phase10-validation.yml'
  pull_request:
    paths:
      - 'phase10/**'
      - '.github/workflows/phase10-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check phase10/evaluate.mjs
      - name: Automated validation tests
        run: node --test phase10/*.test.mjs
      - name: EPA augmented model integration smoke test
        run: node phase10/epa-integration-smoke.mjs
      - name: EPA feature construction smoke test
        run: |
          node --input-type=module -e "import {rollingEpa} from './phase10/rolling-epa.mjs'; const g=[{game_id:'a',gameday:'2025-09-01',season:2025,home_team:'A',away_team:'B'},{game_id:'b',gameday:'2025-09-08',season:2025,home_team:'A',away_team:'C'}];const t=[{game_id:'a',team:'A',offense_epa_per_play:0.3,qb_epa_per_dropback:0.4},{game_id:'a',team:'B',offense_epa_per_play:-0.1,qb_epa_per_dropback:-0.2}];const r=rollingEpa(g,t);if(r[0].home_prior_games!==0||r[1].home_qb_epa_per_dropback!==0.4)process.exit(1);"
      - name: End-to-end CSV evaluation smoke test
        run: |
          node phase10/evaluate.mjs phase10/fixtures/sample-pregame-predictions.csv > phase10-result.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('phase10-result.json','utf8')); if(r.n!==2 || r.excluded.late!==1 || r.accuracy!==1) process.exit(1);"
      - name: Import real nflverse historical outcomes (1999–2025)
        run: node phase10/fetch-games.mjs 1999 2025
      - name: Archive real historical games and provenance
        uses: actions/upload-artifact@v4
        with:
          name: phase10-real-nfl-games
          path: |
            phase10/data/historical-games.csv
            phase10/data/source-summary.json
          retention-days: 30
      - name: Evaluate leakage-safe historical baseline
        run: node phase10/baseline.mjs phase10/data/historical-games.csv phase10/data/baseline-predictions.csv
      - name: Archive baseline predictions
        uses: actions/upload-artifact@v4
        with:
          name: phase10-baseline-predictions
          path: phase10/data/baseline-predictions.csv
          retention-days: 30
      - name: Audit performance by NFL season
        run: node phase10/audit-seasons.mjs phase10/data/baseline-predictions.csv > phase10/data/season-audit.json
      - name: Archive season-by-season audit
        uses: actions/upload-artifact@v4
        with:
          name: phase10-season-audit
          path: phase10/data/season-audit.json
          retention-days: 30
      - name: Evaluate chronological Elo model
        run: node phase10/elo.mjs phase10/data/historical-games.csv phase10/data/elo-predictions.csv > phase10/data/elo-summary.json
      - name: Archive Elo model evaluation
        uses: actions/upload-artifact@v4
        with:
          name: phase10-elo-evaluation
          path: |
            phase10/data/elo-predictions.csv
            phase10/data/elo-summary.json
          retention-days: 30
      - name: Evaluate offensive and defensive matchup model
        run: node phase10/matchups.mjs phase10/data/historical-games.csv phase10/data/matchup-predictions.csv > phase10/data/matchup-summary.json
      - name: Archive matchup model evaluation
        uses: actions/upload-artifact@v4
        with:
          name: phase10-matchup-evaluation
          path: |
            phase10/data/matchup-predictions.csv
            phase10/data/matchup-summary.json
          retention-days: 30
      - name: Generate fixed-weight ensemble
        run: node phase10/ensemble.mjs phase10/data/elo-predictions.csv phase10/data/matchup-predictions.csv phase10/data/ensemble-predictions.csv
      - name: Compare models on common historical games
        run: |
          node phase10/compare-models.mjs baseline=phase10/data/baseline-predictions.csv elo=phase10/data/elo-predictions.csv matchup=phase10/data/matchup-predictions.csv ensemble=phase10/data/ensemble-predictions.csv > phase10/data/model-comparison.json
          cat phase10/data/model-comparison.json
      - name: Archive model comparison
        uses: actions/upload-artifact@v4
        with:
          name: phase10-model-comparison
          path: |
            phase10/data/model-comparison.json
            phase10/data/ensemble-predictions.csv
          retention-days: 30
      - name: Evaluate fixed ensemble on 2023–2025 held-out seasons
        run: |
          node phase10/holdout.mjs phase10/data/ensemble-predictions.csv 2023 > phase10/data/ensemble-holdout.json
          cat phase10/data/ensemble-holdout.json
      - name: Archive ensemble holdout report
        uses: actions/upload-artifact@v4
        with:
          name: phase10-ensemble-holdout
          path: phase10/data/ensemble-holdout.json
          retention-days: 30
